<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>💌 너한테 초대장이 왔어!</title>
<meta name="description" content="귀여운 파티에 초대할게 💕 눌러서 확인해 줘!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tgood2920.github.io/halloween/">
<meta property="og:title" content="💌 너한테 초대장이 왔어!">
<meta property="og:description" content="귀여운 파티에 초대할게 💕 눌러서 확인해 줘!">
<meta property="og:image" content="https://tgood2920.github.io/halloween/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffb3c1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background: #ffe6f0;
    transition: background-color 6s ease, filter 6s ease;
  }
  body.creep { background: #2a2326; filter: saturate(.35) contrast(1.15); }
  body.nocursor, body.nocursor * { cursor: none !important; }

  .stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .hidden { display: none !important; }

  /* ---------- 1. 귀여운 초대장 ---------- */
  #invite { background: rgba(0,0,0,.35); z-index: 5; }
  .card {
    background: #fff7fa; border-radius: 22px; padding: 28px 30px 24px;
    text-align: center; box-shadow: 0 10px 30px rgba(255,111,145,.25);
    max-width: 88vw; animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .card .emoji { font-size: 54px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }
  .card .title { font-size: 23px; font-weight: 700; color: #ff6f91; margin: 10px 0 6px; }
  .card .sub { font-size: 15px; color: #c98a9b; margin: 0 0 18px; transition: color .4s; }
  .card .sub.cold { color: #6b0010; font-weight: 700; letter-spacing: 1px; }
  .btn {
    background: #ffb3c1; color: #fff; border: none; padding: 11px 24px;
    border-radius: 999px; margin: 5px; cursor: pointer; font-size: 17px; font-weight: 700;
    font-family: inherit; transition: background .2s, transform .15s;
  }
  .btn:hover { background: #ff8c9f; transform: scale(1.05); }
  #no.flee { position: fixed; z-index: 10; transition: left .18s ease-out, top .18s ease-out; }

  /* ---------- 2. 로딩 ---------- */
  #load { z-index: 4; color: #ff6f91; text-align: center; }
  #loadEmoji { font-size: 64px; animation: bob 1.2s ease-in-out infinite; }
  #loadText { font-size: 22px; font-weight: 700; margin: 14px 0; min-height: 1.4em; }
  .bar { width: min(340px, 78vw); height: 18px; border-radius: 999px; background: #ffd3df; overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff9ab3, #ff6f91); transition: background 1s; }
  #pct { font-size: 18px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  #load.red #loadText, #load.red #pct { color: #b3001b; text-shadow: 0 0 8px #ff0022; }
  #load.red #fill { background: #8a0010; }
  .shiver { animation: shiver .09s infinite; }
  @keyframes shiver { 25% { transform: translate(1px,-1px); } 75% { transform: translate(-1px,1px); } }

  /* ---------- 깜빡임 / 암전 ---------- */
  #blackout { position: fixed; inset: 0; background: #000; z-index: 20; display: none; }
  #blackout.on { display: block; }

  /* ---------- 3. 어둠 ---------- */
  #dark { background: #000; z-index: 30; }
  #whisper {
    color: #8c8c8c; font-size: clamp(18px, 4.4vw, 30px); letter-spacing: 3px; text-align: center;
    min-height: 1.5em; padding: 0 6vw; text-shadow: 0 0 6px rgba(255,255,255,.15);
    transition: opacity 1.2s;
  }
  #whisper.red { color: #9e0016; text-shadow: 0 0 12px #ff0022; }
  #eyes { position: fixed; display: flex; gap: 46px; opacity: 0; transition: opacity .9s ease-in; pointer-events: none; }
  #eyes.on { opacity: 1; }
  #eyes span {
    width: 26px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 18%, #ff2a2a 30%, #5a0000 70%, transparent 72%);
    box-shadow: 0 0 18px 4px rgba(255,0,0,.35);
    animation: blink 3.8s infinite;
  }
  #eyes span:last-child { transform: rotate(8deg); }
  @keyframes blink { 0%, 46%, 54%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.05); } }

  /* ---------- 4. 점프 스케어 ---------- */
  #scare { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; background: #000; display: block; }

  /* ---------- 5. 끝 ---------- */
  #end { background: radial-gradient(circle at 50% 40%, #1a0004, #000 70%); z-index: 40; color: #c9c9c9; text-align: center; }
  #endTitle {
    position: relative; margin: 0; font-size: clamp(38px, 10vw, 96px); font-weight: 900;
    color: #a3000f; letter-spacing: 2px; text-shadow: 0 0 18px rgba(255,0,30,.55), 2px 3px 0 #300;
    animation: wob 4s ease-in-out infinite;
  }
  @keyframes wob { 50% { transform: skewX(-3deg) translateY(2px); } }
  .drip {
    position: absolute; top: 82%; width: 8px; border-radius: 0 0 8px 8px;
    background: linear-gradient(#a3000f, #6b0008); height: 0;
    animation: drip var(--d) ease-in forwards; animation-delay: var(--w);
  }
  .drip::after { content: ""; position: absolute; bottom: -6px; left: -2px; width: 12px; height: 12px; border-radius: 50%; background: #6b0008; }
  @keyframes drip { to { height: var(--h); } }
  #endSub { font-size: 20px; margin: 70px 0 22px; opacity: 0; animation: fadein 2s 1.5s forwards; }
  #again { background: #3b0008; color: #ffb3b3; opacity: 0; animation: fadein 1.5s .5s forwards; }
  #again:hover { background: #5a000c; }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>

<!-- 1. 귀여운 초대장 -->
<div id="invite" class="stage">
  <div class="card">
    <div class="emoji" id="cardEmoji">👻</div>
    <p class="title">나랑 할로윈 같이 보낼래?</p>
    <p class="sub" id="cardSub">귀여운 파티 준비했어 💕</p>
    <button class="btn" id="yes">🎃 좋아</button>
    <button class="btn" id="no">🕸 싫어</button>
  </div>
</div>

<!-- 2. 로딩 -->
<div id="load" class="stage hidden">
  <div id="loadEmoji">🎃</div>
  <p id="loadText"></p>
  <div class="bar"><div id="fill"></div></div>
  <p id="pct">0%</p>
</div>

<!-- 3. 어둠 -->
<div id="dark" class="stage hidden">
  <p id="whisper"></p>
  <div id="eyes"><span></span><span></span></div>
</div>

<div id="blackout"></div>

<!-- 4. 점프 스케어 -->
<canvas id="scare" class="hidden"></canvas>

<!-- 5. 끝 -->
<div id="end" class="stage hidden">
  <h1 id="endTitle">HAPPY HALLOWEEN</h1>
  <p id="endSub">🎃 놀랐어? 🎃</p>
  <button class="btn" id="again">한 번 더 할래?</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const show = id => $(id).classList.remove('hidden');
  const hide = id => $(id).classList.add('hidden');

  /* ================= 오디오 (전부 즉석 합성) ================= */
  let ac, master;
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -6; comp.ratio.value = 6;
    master = ac.createGain(); master.gain.value = 1;
    master.connect(comp); comp.connect(ac.destination);
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function noiseBuf(sec) {
    const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function panner(v) {
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = v; return p; }
    return ac.createGain();
  }
  function distCurve(k) {
    const n = 44100, c = new Float32Array(n), deg = Math.PI / 180;
    for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x)); }
    return c;
  }

  // 오르골: creep(0~1)이 오를수록 음이 처지고, 흔들리고, 느려진다
  let creep = 0, boxOn = false;
  const MELODY = [76, 79, 84, 79, 81, 79, 76, 74, 72, 74, 76, 79, 77, 74, 72, null];
  function boxNote(freq, t, vol) {
    const o = ac.createOscillator(), o2 = ac.createOscillator();
    o.type = 'triangle'; o2.type = 'sine';
    o.frequency.setValueAtTime(freq, t); o2.frequency.setValueAtTime(freq * 2.01, t);
    const g = ac.createGain(), g2 = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
    g2.gain.value = 0.25;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t + 1.4); o2.stop(t + 1.4);
  }
  function startBox() {
    if (!ac) return;
    boxOn = true;
    let i = 0;
    (function step() {
      if (!boxOn) return;
      const m = MELODY[i++ % MELODY.length];
      if (m !== null) {
        const sag = 1 - creep * 0.14;                              // 전체적으로 음이 처짐
        const wob = 1 + (Math.random() - 0.5) * creep * 0.07;      // 음정이 흔들림
        boxNote(mtof(m) * sag * wob, ac.currentTime, 0.16);
        if (creep > 0.6 && Math.random() < 0.4)                    // 불협화음이 끼어듦
          boxNote(mtof(m + (Math.random() < .5 ? 1 : 6)) * sag, ac.currentTime + 0.02, 0.08);
      }
      setTimeout(step, 270 * (1 + creep * 1.4) + Math.random() * creep * 160);
    })();
  }
  const stopBox = () => { boxOn = false; };

  function glitchSound() {
    if (!ac) return;
    const t = ac.currentTime, n = ac.createBufferSource();
    n.buffer = noiseBuf(0.25);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(800, 3000); bp.Q.value = 2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + rand(0.06, 0.2));
    n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.25);
  }

  function thump(t, vol) {
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
  }
  let heartOn = false;
  function startHeart() {
    if (!ac) return;
    heartOn = true;
    let gap = 800, vol = 0.6;
    (function beat() {
      if (!heartOn) return;
      const t = ac.currentTime;
      thump(t, vol); thump(t + 0.21, vol * 0.7);
      gap = Math.max(380, gap * 0.88); vol = Math.min(1, vol * 1.05);
      setTimeout(beat, gap);
    })();
  }

  let drone = null;
  function startDrone() {
    if (!ac) return;
    const t = ac.currentTime, out = ac.createGain();
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.4, t + 1.2);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
    const srcs = [];
    [43.6, 44.1, 61.7].forEach(f => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * pitch;
      o.connect(lp); o.start(t); srcs.push(o);
    });
    const n = ac.createBufferSource(); n.buffer = noiseBuf(3); n.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 0.6;
    const ng = ac.createGain(); ng.gain.value = 0.06;
    n.connect(bp); bp.connect(ng); ng.connect(out); n.start(t); srcs.push(n);
    lp.connect(out); out.connect(master);
    drone = { out, srcs };
  }
  function cutDrone() {           // 뚝 끊는다 (정적이 더 무섭다)
    if (!drone) return;
    const t = ac.currentTime;
    drone.out.gain.cancelScheduledValues(t);
    drone.out.gain.setValueAtTime(drone.out.gain.value, t);
    drone.out.gain.linearRampToValueAtTime(0, t + 0.03);
    drone.srcs.forEach(s => s.stop(t + 0.1));
    drone = null;
  }

  // 속삭임: 필터 거친 잡음을 음절처럼 끊고, 왼쪽→오른쪽(=뒤에서 도는 느낌)으로 이동
  function whisperSound(dur, panFrom, panTo) {
    if (!ac) return;
    const t = ac.currentTime, n = ac.createBufferSource();
    n.buffer = noiseBuf(dur + 0.2);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3.5;
    bp.frequency.setValueAtTime(1800, t);
    const g = ac.createGain(); g.gain.setValueAtTime(0, t);
    let tt = t;
    while (tt < t + dur - 0.3) {
      const syl = rand(0.09, 0.24);
      bp.frequency.linearRampToValueAtTime(rand(900, 3600), tt + syl * 0.5);
      g.gain.linearRampToValueAtTime(rand(0.35, 0.7), tt + syl * 0.3);
      g.gain.linearRampToValueAtTime(0.03, tt + syl);
      tt += syl + rand(0, 0.06);
    }
    g.gain.linearRampToValueAtTime(0, t + dur);
    const p = panner(panFrom);
    if (p.pan) p.pan.linearRampToValueAtTime(panTo, t + dur);
    n.connect(bp); bp.connect(g); g.connect(p); p.connect(master);
    n.start(t); n.stop(t + dur + 0.2);
  }

  function screamSound(dur, pitch = 1) {
    if (!ac) return;
    const t = ac.currentTime;
    // 쿵 + 찢어지는 타격음
    const b = ac.createOscillator(); b.type = 'sine';
    b.frequency.setValueAtTime(160, t); b.frequency.exponentialRampToValueAtTime(26, t + 0.8);
    const bg = ac.createGain(); bg.gain.setValueAtTime(1.2, t); bg.gain.exponentialRampToValueAtTime(0.001, t + 1);
    b.connect(bg); bg.connect(master); b.start(t); b.stop(t + 1.1);
    const hit = ac.createBufferSource(); hit.buffer = noiseBuf(0.3);
    const hg = ac.createGain(); hg.gain.setValueAtTime(1.2, t); hg.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    hit.connect(hg); hg.connect(master); hit.start(t); hit.stop(t + 0.3);

    // 비명
    const out = ac.createGain();
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(1.1, t + 0.01);
    out.gain.setValueAtTime(1.1, t + Math.max(0.05, dur - 0.5)); out.gain.exponentialRampToValueAtTime(0.001, t + dur);
    const sh = ac.createWaveShaper(); sh.curve = distCurve(500); sh.oversample = '4x';
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 200;
    sh.connect(hp); hp.connect(out); out.connect(master);
    [1, 1.47, 2.03, 0.5, 2.96, 3.6, 4.3].forEach((m, i) => {
      const base = 430 * m * pitch, o = ac.createOscillator();
      o.type = i % 2 ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(base * 0.6, t);
      o.frequency.exponentialRampToValueAtTime(base * 1.35, t + 0.15);
      o.frequency.exponentialRampToValueAtTime(base * 0.75, t + dur);
      const lfo = ac.createOscillator(); lfo.frequency.value = rand(7, 18);
      const lg = ac.createGain(); lg.gain.value = base * 0.09;
      lfo.connect(lg); lg.connect(o.frequency);
      const g = ac.createGain(); g.gain.value = 0.24 / (1 + i * 0.5);
      o.connect(g); g.connect(sh);
      o.start(t); lfo.start(t); o.stop(t + dur); lfo.stop(t + dur);
    });
    // 고막을 긁는 고음 불협화음
    [2093, 2217, 2349].forEach(f => {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * pitch;
      const trem = ac.createOscillator(); trem.frequency.value = rand(14, 22);
      const tg = ac.createGain(); tg.gain.value = 0.05;
      const g = ac.createGain(); g.gain.value = 0.06;
      trem.connect(tg); tg.connect(g.gain);
      o.connect(g); g.connect(out);
      o.start(t); trem.start(t); o.stop(t + dur); trem.stop(t + dur);
    });
    const n = ac.createBufferSource(); n.buffer = noiseBuf(dur);
    const nb = ac.createBiquadFilter(); nb.type = 'bandpass'; nb.frequency.value = 1900; nb.Q.value = 0.9;
    const ng = ac.createGain(); ng.gain.value = 0.6;
    n.connect(nb); nb.connect(ng); ng.connect(sh); n.start(t); n.stop(t + dur);
  }

  /* ================= 화면 효과 ================= */
  function glitchText(el, finalText, ms = 650) {
    const chars = '█▓▒░#@$%&*?!ㅎㅋㄱㅁ죽뒤눈';
    const start = performance.now();
    return new Promise(res => {
      (function f(now) {
        if (now - start >= ms) { el.textContent = finalText; return res(); }
        el.textContent = Array.from(finalText, c => c === ' ' || Math.random() < 0.35 ? c : chars[Math.floor(Math.random() * chars.length)]).join('');
        requestAnimationFrame(f);
      })(start);
    });
  }
  async function typeText(el, text, speed = 110) {
    el.textContent = '';
    for (const c of text) { el.textContent += c; await sleep(c === '.' ? speed * 3 : speed + rand(-30, 60)); }
  }
  function tween(from, to, ms, fn) {
    const s = performance.now();
    return new Promise(res => {
      (function f(now) {
        const k = Math.min((now - s) / ms, 1);
        fn(from + (to - from) * k);
        k < 1 ? requestAnimationFrame(f) : res();
      })(s);
    });
  }

  // 무서운 얼굴: open(0~1) = 입이 벌어진 정도. 미리 오프스크린 캔버스에 그려둔다
  function makeFace(S, open) {
    const c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d');                   // 배경은 투명 (얼굴끼리 겹쳐도 가리지 않게)
    const cx = S / 2, cy = S * 0.44;
    const chin = cy + S * (0.44 + open * 0.1);

    // 해골처럼 마른 머리 윤곽
    x.save();
    x.beginPath();
    x.moveTo(cx, cy - S * 0.46);
    x.bezierCurveTo(cx + S * 0.33, cy - S * 0.46, cx + S * 0.37, cy - S * 0.1, cx + S * 0.31, cy + S * 0.08);
    x.bezierCurveTo(cx + S * 0.26, cy + S * 0.22, cx + S * 0.2, chin - S * 0.06, cx, chin);
    x.bezierCurveTo(cx - S * 0.2, chin - S * 0.06, cx - S * 0.26, cy + S * 0.22, cx - S * 0.31, cy + S * 0.08);
    x.bezierCurveTo(cx - S * 0.37, cy - S * 0.1, cx - S * 0.33, cy - S * 0.46, cx, cy - S * 0.46);
    x.closePath();
    // 아래에서 비추는 차가운 빛
    const hg = x.createRadialGradient(cx, cy + S * 0.18, S * 0.03, cx, cy, S * 0.55);
    hg.addColorStop(0, '#d6d8c8'); hg.addColorStop(0.35, '#a7ab98'); hg.addColorStop(0.7, '#555a4b'); hg.addColorStop(1, '#0b0c09');
    x.fillStyle = hg; x.fill(); x.clip();

    for (let i = 0; i < 700; i++) {                 // 썩은 얼룩
      x.fillStyle = `rgba(${rand(30, 80) | 0},${rand(25, 55) | 0},${rand(15, 45) | 0},${rand(0, 0.1)})`;
      x.beginPath(); x.arc(rand(0, S), rand(0, S), rand(2, 50), 0, 7); x.fill();
    }
    for (const sd of [-1, 1]) {                      // 움푹 꺼진 관자놀이와 볼
      for (const [ox, oy, r, a] of [[0.27, -0.2, 0.14, .6], [0.2, 0.13, 0.15, .7]]) {
        const gx = cx + sd * S * ox, gy = cy + S * oy;
        const g = x.createRadialGradient(gx, gy, 0, gx, gy, S * r);
        g.addColorStop(0, `rgba(10,8,5,${a})`); g.addColorStop(1, 'rgba(10,8,5,0)');
        x.fillStyle = g; x.fillRect(0, 0, S, S);
      }
    }
    x.lineCap = 'round';                            // 핏줄
    for (let v = 0; v < 40; v++) {
      let px = rand(cx - S * 0.32, cx + S * 0.32), py = rand(cy - S * 0.45, cy + S * 0.45);
      x.strokeStyle = `rgba(${rand(40, 80) | 0},5,${rand(20, 45) | 0},${rand(.15, .35)})`;
      x.lineWidth = rand(1, 4);
      x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 16; k++) { px += rand(-16, 16); py += rand(-16, 16); x.lineTo(px, py); }
      x.stroke();
    }
    for (let k = 0; k < 4; k++) {                  // 찌푸린 이마 주름 (울퉁불퉁하게)
      const yy = cy - S * (0.24 + k * 0.045), w = S * rand(0.1, 0.2);
      x.strokeStyle = `rgba(15,10,8,${rand(.2, .4)})`; x.lineWidth = rand(3, 7);
      x.beginPath();
      for (let j = 0; j <= 12; j++) {
        const u = j / 12, px = cx - w + 2 * w * u;
        const py = yy + Math.sin(u * Math.PI) * S * 0.03 + rand(-4, 4);
        j ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.stroke();
    }

    // 눈: 텅 빈 검은 구멍 + 핏빛 테두리 + 바늘 같은 눈동자 + 피눈물
    const eyes = [{ s: -1, r: 1.15, a: 0.35 }, { s: 1, r: 0.95, a: -0.22 }];
    for (const e of eyes) {
      const ex = cx + e.s * S * 0.13, ey = cy - S * 0.07;
      const g = x.createRadialGradient(ex, ey, 0, ex, ey, S * 0.16 * e.r);
      g.addColorStop(0, '#000'); g.addColorStop(0.6, '#000'); g.addColorStop(0.74, 'rgba(70,0,6,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g;
      x.beginPath(); x.ellipse(ex, ey, S * 0.14 * e.r, S * 0.11 * e.r, e.a, 0, 7); x.fill();
      for (let k = 0; k < 4; k++) {
        let px = ex + rand(-S * 0.05, S * 0.05), py = ey + S * 0.07;
        x.strokeStyle = k % 2 ? 'rgba(60,0,4,.9)' : 'rgba(8,0,0,.9)';
        x.lineWidth = rand(5, 15);
        x.beginPath(); x.moveTo(px, py);
        const len = rand(S * 0.15, S * 0.45);
        for (let d = 0; d < len; d += 10) { px += rand(-3, 3); py += 10; x.lineTo(px, py); }
        x.stroke();
      }
      x.save();
      x.shadowColor = '#fff'; x.shadowBlur = S * 0.035; x.fillStyle = '#fff';
      x.beginPath(); x.arc(ex - e.s * S * 0.014, ey + S * 0.006, S * 0.01, 0, 7); x.fill();
      x.restore();
    }

    x.fillStyle = '#050302';                        // 해골 같은 코 구멍
    x.beginPath();
    x.moveTo(cx, cy + S * 0.03); x.lineTo(cx - S * 0.04, cy + S * 0.12); x.lineTo(cx + S * 0.04, cy + S * 0.12);
    x.closePath(); x.fill();

    // 입: 세로로 찢어진 거대한 입 + 안쪽을 향한 이빨 고리
    const mx = cx, my = cy + S * (0.25 + open * 0.06);
    const rx = S * (0.1 + open * 0.035), ry = S * (0.06 + open * 0.17);
    x.save();
    x.beginPath(); x.ellipse(mx, my, rx, ry, 0, 0, 7);
    const mg = x.createRadialGradient(mx, my, 0, mx, my, ry);
    mg.addColorStop(0, '#000'); mg.addColorStop(0.55, '#070000'); mg.addColorStop(0.88, '#3d0006'); mg.addColorStop(1, '#5c0a0f');
    x.fillStyle = mg; x.fill();
    x.lineWidth = S * 0.012; x.strokeStyle = '#220002'; x.stroke();
    x.clip();
    for (let a = 0; a < Math.PI * 2; a += rand(0.13, 0.22)) {
      if (Math.random() < 0.12) continue;           // 빠진 이빨
      const w = 0.07, L = rand(0.15, 0.4);
      const p1 = [mx + Math.cos(a - w) * rx, my + Math.sin(a - w) * ry];
      const p2 = [mx + Math.cos(a + w) * rx, my + Math.sin(a + w) * ry];
      const tip = [mx + Math.cos(a + rand(-.06, .06)) * rx * (1 - L), my + Math.sin(a) * ry * (1 - L)];
      const tg = x.createLinearGradient(p1[0], p1[1], tip[0], tip[1]);
      tg.addColorStop(0, '#6e5f3e'); tg.addColorStop(1, '#ddd2a8');
      x.fillStyle = tg; x.strokeStyle = 'rgba(40,15,5,.85)'; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(...p1); x.lineTo(...tip); x.lineTo(...p2); x.closePath(); x.fill(); x.stroke();
    }
    x.restore();
    x.lineCap = 'round';
    for (let k = 0; k < 5; k++) {                   // 턱으로 흘러내리는 피
      let px = mx + rand(-rx * 0.7, rx * 0.7), py = my + ry * 0.85;
      x.strokeStyle = k % 2 ? 'rgba(70,0,5,.9)' : 'rgba(30,0,2,.9)';
      x.lineWidth = rand(4, 11);
      x.beginPath(); x.moveTo(px, py);
      const len = rand(S * 0.05, S * 0.2);
      for (let d = 0; d < len; d += 10) { px += rand(-2, 2); py += 10; x.lineTo(px, py); }
      x.stroke();
    }
    x.strokeStyle = 'rgba(90,0,8,.75)';             // 입꼬리에서 귀까지 찢어진 자국
    x.lineWidth = 4;
    for (const sd of [-1, 1]) {
      let px = mx + sd * rx * 0.9, py = my - ry * 0.3;
      x.beginPath(); x.moveTo(px, py);
      for (let k = 0; k < 5; k++) { px += sd * rand(8, 18); py -= rand(5, 12); x.lineTo(px, py); }
      x.stroke();
    }
    x.strokeStyle = 'rgba(0,0,0,.6)';              // 금 간 피부
    for (let k = 0; k < 12; k++) {
      let px = rand(0, S), py = rand(0, S);
      x.lineWidth = rand(1, 3); x.beginPath(); x.moveTo(px, py);
      for (let j = 0; j < 9; j++) { px += rand(-30, 30); py += rand(-30, 30); x.lineTo(px, py); }
      x.stroke();
    }
    x.restore();

    // 피부 질감(픽셀 잡음) — 그림 같은 느낌을 없앤다
    const img = x.getImageData(0, 0, S, S), dd = img.data;
    for (let i = 0; i < dd.length; i += 4) {
      const n = (Math.random() - 0.5) * 34;
      dd[i] += n; dd[i + 1] += n * 0.9; dd[i + 2] += n * 0.8;
    }
    x.putImageData(img, 0, 0);

    const vg = x.createRadialGradient(cx, cy, S * 0.22, cx, cy, S * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.96)');
    x.globalCompositeOperation = 'source-atop';    // 얼굴 위에만 그림자
    x.fillStyle = vg; x.fillRect(0, 0, S, S);
    x.globalCompositeOperation = 'source-over';
    return c;
  }
  function makeGrain(n) {
    const out = [];
    for (let k = 0; k < n; k++) {
      const c = document.createElement('canvas'); c.width = c.height = 360;
      const x = c.getContext('2d'), img = x.createImageData(360, 360);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
      }
      x.putImageData(img, 0, 0); out.push(c);
    }
    return out;
  }

  // 경련하듯 덜덜 떨며 덮쳐 오는 얼굴. lunge2 = 중간에 한 번 더 확 다가옴
  function runScare(faces, grain, dur, lunge2) {
    const cv = $('scare'); show('scare');
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const W = cv.width = Math.floor(innerWidth * dpr), H = cv.height = Math.floor(innerHeight * dpr);
    const x = cv.getContext('2d');
    const M = Math.max(W, H);
    const flashes = lunge2 ? [0, 1.45] : [0];
    const inverts = lunge2 ? [0.55, 1.5] : [0.3];
    const start = performance.now();
    let frame = 0, hold = 0;
    const pose = { f: faces[1], rot: 0, sc: 1, dx: 0, dy: 0 };
    return new Promise(res => {
      (function f(now) {
        const t = (now - start) / 1000;
        x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
        if (hold-- <= 0) {                                               // 몇 프레임마다 자세가 툭툭 바뀜
          hold = 1 + (Math.random() * 3 | 0);
          pose.f = Math.random() < 0.75 ? faces[1] : faces[0];
          pose.rot = rand(-0.14, 0.14);
          pose.sc = rand(0.95, 1.1);
          const sh = M * (t < dur - 0.5 ? 0.05 : 0.015);
          pose.dx = rand(-sh, sh); pose.dy = rand(-sh, sh);
        }
        const lunge = 1 - Math.pow(1 - Math.min(t / 0.1, 1), 3);
        let zoom = 0.3 + lunge * 1.1 + t * 0.12;
        if (lunge2 && t > 1.4) zoom += (1 - Math.pow(1 - Math.min((t - 1.4) / 0.08, 1), 3)) * 0.75;
        const size = M * zoom * pose.sc;
        x.save();
        x.translate(W / 2 + pose.dx, H / 2 + pose.dy + size * 0.06);
        x.rotate(pose.rot);
        x.drawImage(pose.f, -size / 2, -size / 2, size, size);
        x.restore();
        if (Math.random() < 0.35) {                                      // 잔상
          x.globalAlpha = 0.3;
          const s2 = size * 1.12;
          x.drawImage(faces[0], W / 2 - s2 / 2 + rand(-M * 0.05, M * 0.05), H / 2 - s2 / 2 + size * 0.06, s2, s2);
          x.globalAlpha = 1;
        }
        if (Math.random() < 0.6) {                                       // 화면 찢김
          for (let i = 0; i < 6; i++) {
            const sy = rand(0, H), sh = rand(6, H * 0.1), off = rand(-W * 0.09, W * 0.09);
            x.drawImage(cv, 0, sy, W, sh, off, sy, W, sh);
          }
        }
        x.globalCompositeOperation = 'multiply';                         // 핏빛 색조
        x.fillStyle = 'rgb(255,150,150)'; x.fillRect(0, 0, W, H);
        x.globalCompositeOperation = 'source-over';
        if (flashes.some(fl => t >= fl && t < fl + 0.08)) {
          x.fillStyle = 'rgba(210,0,10,.5)'; x.fillRect(0, 0, W, H);
        }
        if (inverts.some(fl => t >= fl && t < fl + 0.05)) {              // 한 프레임 반전
          x.globalCompositeOperation = 'difference';
          x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
          x.globalCompositeOperation = 'source-over';
        }
        x.globalAlpha = 0.11; x.drawImage(grain[frame++ % grain.length], 0, 0, W, H); x.globalAlpha = 1;
        t < dur ? requestAnimationFrame(f) : res();
      })(start);
    });
  }

  // 두 번째 스케어: 얼굴이 사방에서 불어나다가, 가운데 얼굴이 입으로 화면을 삼킨다
  function runSwarm(faces, grain, dur) {
    const cv = $('scare'); show('scare');
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const W = cv.width = Math.floor(innerWidth * dpr), H = cv.height = Math.floor(innerHeight * dpr);
    const x = cv.getContext('2d');
    const M = Math.max(W, H);
    const swallow = dur - 1;                       // 삼키기 시작 시각
    const crowd = [];
    const start = performance.now();
    let frame = 0;
    return new Promise(res => {
      (function f(now) {
        const t = (now - start) / 1000;
        x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

        if (t < swallow && frame % 2 === 0) {      // 얼굴이 계속 늘어난다
          crowd.push({ x: rand(0, W), y: rand(0, H), s: M * rand(0.16, 0.45), r: rand(-0.5, 0.5), born: t });
          if (crowd.length > 55) crowd.shift();
        }
        for (const c of crowd) {
          const grow = Math.min((t - c.born) / 0.07, 1);
          const sz = c.s * (0.3 + 0.7 * grow) * rand(0.94, 1.07);
          x.save();
          x.translate(c.x + rand(-8, 8) * dpr, c.y + rand(-8, 8) * dpr);
          x.rotate(c.r + rand(-0.1, 0.1));
          x.drawImage(Math.random() < 0.6 ? faces[1] : faces[0], -sz / 2, -sz / 2, sz, sz);
          x.restore();
        }

        // 가운데 얼굴: 덮쳐 왔다가, 마지막에 입 속으로 빨아들인다
        const lunge = 1 - Math.pow(1 - Math.min(t / 0.12, 1), 3);
        let zoom = 0.25 + lunge * 0.5, focusY = 0.5;
        if (t > swallow) {
          const k = Math.min((t - swallow) / 0.75, 1);
          zoom += k * k * k * 8;
          focusY = 0.5 + 0.25 * Math.min(k * 2.5, 1);  // 입(얼굴 높이의 75% 지점)을 화면 가운데로
        }
        const size = M * zoom, sh = M * (t > swallow ? 0.012 : 0.03);
        x.save();
        x.translate(W / 2 + rand(-sh, sh), H / 2 + rand(-sh, sh));
        x.rotate(rand(-0.05, 0.05));
        x.drawImage(faces[1], -size / 2, -size * focusY, size, size);
        x.restore();

        if (Math.random() < 0.5) {                 // 화면 찢김
          for (let i = 0; i < 5; i++) {
            const sy = rand(0, H), sl = rand(6, H * 0.08), off = rand(-W * 0.08, W * 0.08);
            x.drawImage(cv, 0, sy, W, sl, off, sy, W, sl);
          }
        }
        x.globalCompositeOperation = 'multiply';
        x.fillStyle = 'rgb(255,140,140)'; x.fillRect(0, 0, W, H);
        x.globalCompositeOperation = 'source-over';
        if ([0.45, swallow].some(fl => t >= fl && t < fl + 0.05)) {
          x.globalCompositeOperation = 'difference';
          x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
          x.globalCompositeOperation = 'source-over';
        }
        if (t > dur - 0.2) { x.fillStyle = '#000'; x.fillRect(0, 0, W, H); }   // 삼켜짐
        x.globalAlpha = 0.11; x.drawImage(grain[frame++ % grain.length], 0, 0, W, H); x.globalAlpha = 1;
        t < dur ? requestAnimationFrame(f) : res();
      })(start);
    });
  }

  function makeDrips() {
    const h = $('endTitle');
    for (let i = 0; i < 9; i++) {
      const d = document.createElement('span');
      d.className = 'drip';
      d.style.left = rand(4, 94) + '%';
      d.style.width = rand(5, 11) + 'px';
      d.style.setProperty('--h', rand(30, 120) + 'px');
      d.style.setProperty('--d', rand(3, 7) + 's');
      d.style.setProperty('--w', rand(0.2, 2) + 's');
      h.appendChild(d);
    }
  }

  /* ================= 1단계: 초대장 ================= */
  const no = $('no');
  let dodges = 0, lastDodge = 0;
  function dodge(e) {
    if (dodges >= 3 || started) return;
    e.preventDefault();
    dodges++; lastDodge = performance.now();
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('flee')) { no.style.left = r.left + 'px'; no.style.top = r.top + 'px'; no.classList.add('flee'); void no.offsetWidth; }
    no.style.left = rand(10, innerWidth - r.width - 10) + 'px';
    no.style.top = rand(10, innerHeight - r.height - 10) + 'px';
    const sub = $('cardSub');
    if (dodges === 1) sub.textContent = '에이~ 그러지 말고 💕';
    if (dodges === 2) sub.textContent = '진짜 싫어? 🥺';
    if (dodges === 3) { sub.textContent = '도망가지 마.'; sub.classList.add('cold'); $('cardEmoji').textContent = '🙂'; }
  }
  no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(e); });
  no.addEventListener('pointerdown', dodge);

  let started = false;
  function onPick() {
    if (performance.now() - lastDodge < 450) return;   // 모바일: 피한 직후의 탭은 무시
    begin();
  }
  $('yes').addEventListener('click', onPick);
  no.addEventListener('click', onPick);

  // 다른 탭으로 가면 제목이 바뀐다
  const origTitle = document.title;
  document.addEventListener('visibilitychange', () => {
    document.title = document.hidden ? '돌아와... 👁' : origTitle;
  });

  /* ================= 전체 시퀀스 ================= */
  async function begin() {
    if (started) return;
    started = true;
    initAudio();
    if (ac && ac.resume) ac.resume().catch(() => {});
    const el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rf) { try { const p = rf.call(el); p && p.catch && p.catch(() => {}); } catch (e) {} }

    prepare();
    hide('invite'); no.classList.add('hidden');
    show('load');
    startBox();

    // 2단계: 귀여운 로딩 → 서서히 이상해짐
    const fill = $('fill'), pct = $('pct'), lt = $('loadText'), le = $('loadEmoji');
    const setP = p => { fill.style.width = p + '%'; pct.textContent = Math.floor(p) + '%'; };
    // 전체 약 1.6초: 로딩 0.3초 → 붉게 0.2초 → 깜빡임 0.25초 → 어둠 속 눈 0.5초 → 정적 0.4초 (문구 없음)
    lt.textContent = '';
    document.body.classList.add('creep', 'nocursor');
    await tween(0, 66, 300, p => { setP(p); creep = p / 66; });
    creep = 1;
    $('load').classList.add('red', 'shiver');
    le.textContent = '👁';
    pct.textContent = '666%';
    await sleep(200);

    // 깜빡깜빡 → 암전
    const bo = $('blackout');
    for (const d of [60, 120, 70]) {
      bo.classList.toggle('on'); glitchSound(); await sleep(d);
    }
    stopBox();

    // 3단계: 어둠 속 눈
    hide('load'); show('dark'); bo.classList.remove('on');
    const eyes = $('eyes');
    eyes.style.transition = 'none';
    eyes.style.left = rand(10, 70) + 'vw'; eyes.style.top = rand(12, 75) + 'vh';
    eyes.classList.add('on');
    whisperSound(0.6, 0.3, 1);
    if (ac) { const t = ac.currentTime; thump(t, 0.9); thump(t + 0.21, 0.65); }
    await sleep(500);

    // 완전한 정적
    eyes.classList.remove('on'); eyes.style.opacity = 0;
    await sleep(400);

    // 4단계: 점프 스케어 (중간에 비명과 함께 한 번 더 덮침)
    screamSound(3);
    setTimeout(() => screamSound(1.5), 1400);
    if (navigator.vibrate) navigator.vibrate([500, 60, 300, 60, 900]);
    hide('dark');
    await runScare(faces, grain, 3, true);

    // 5단계: 끝 화면 … 인 척
    show('end'); hide('scare');
    $('again').classList.add('hidden');
    makeDrips();
    if (ac) {                                 // 멀리서 들리는 일그러진 오르골 몇 음
      const t = ac.currentTime + 0.8;
      [76, 79, 84, 79].forEach((m, i) => boxNote(mtof(m) * 0.82, t + i * 0.9, 0.06));
    }
    await sleep(4300);

    // 6단계: 끝난 줄 알았지...
    hide('end'); show('dark');                // 갑자기 불이 꺼진다
    const w2 = $('whisper');
    w2.classList.add('red'); w2.style.opacity = 1; w2.textContent = '';
    await sleep(1000);
    whisperSound(2.6, -1, 1);
    await typeText(w2, '끝난 줄 알았지...', 170);
    await sleep(900);
    await glitchText(w2, '끝난 줄 알았지...', 350);
    w2.textContent = '';
    await sleep(700);                         // 정적

    const SW = 3.2;
    [[0, 1], [0.25, 1.35], [0.5, 0.7], [0.8, 1.7], [1.1, 0.85], [1.5, 1.2]].forEach(([d, pt]) =>
      setTimeout(() => screamSound(SW - d, pt), d * 1000));                 // 비명 합창
    setTimeout(() => screamSound(0.9, 0.5), (SW - 1) * 1000);               // 삼킬 때 낮은 포효
    if (navigator.vibrate) navigator.vibrate([300, 50, 300, 50, 300, 50, 1200]);
    hide('dark');
    await runSwarm(faces, grain, SW);

    // 삼켜진 뒤의 완전한 암흑과 정적
    hide('scare');
    $('blackout').classList.add('on');
    await sleep(1800);
    $('blackout').classList.remove('on');
    $('endSub').textContent = '🎃 이번엔 진짜 끝이야. 아마도.';
    show('end');
    document.body.classList.remove('nocursor');
    $('again').classList.remove('hidden');
  }

  // 얼굴은 페이지가 열릴 때 미리 그려 둔다 (클릭 후 지연 없게)
  let faces = null, grain = null;
  const prepare = () => { if (!faces) { faces = [makeFace(900, 0.25), makeFace(900, 1)]; grain = makeGrain(4); } };
  setTimeout(prepare, 300);

  $('again').addEventListener('click', () => location.reload());
})();
</script>
</body>
</html>
